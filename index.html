<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the SVG favicon and, for a home-screen save, composites any
         transparent icon onto black. So this one is a flat opaque 180px tile;
         iOS rounds the corners itself, which is why the PNG has square ones. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PawSome" />
    <!-- Without a manifest, Chrome on Android cannot offer to install this at
         all, and an iOS home-screen save opens in full Safari chrome. The
         separate maskable icon is what stops Android cropping the mark into its
         own icon shape: the "any" icons are full-bleed, the maskable one is
         inset to sit inside the safe circle. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `interactive-widget=resizes-content` makes the on-screen keyboard
         shorten the layout viewport rather than slide over it, so anything
         sized in `dvh` — the chat pane, the modals, the docked onboarding
         actions — resizes to what's left instead of putting its bottom edge
         under the keys. Chrome on Android honours it; iOS ignores it and keeps
         scrolling the focused field into view as before, which is why the
         layouts are capped in `dvh` and scrollable rather than relying on it.
         `viewport-fit=cover` is now on: the fixed bottom tab bar (see
         BottomTabBar.tsx) needs `env(safe-area-inset-bottom)` to resolve to a
         real value on notched/home-indicator devices, or it sits flush against
         the indicator with its icons underneath it. Every other bottom-docked
         element in the app was audited for safe-area padding first. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ── Search ──────────────────────────────────────────────────────────────
         The description this replaces read "…with breeders who are verified and
         actually responsible", which describes a different product. Nothing here
         sells or lists breeders; it matches pets with pets nearby so their
         owners can arrange a walk. That copy was what a search result promised,
         so anyone who clicked it arrived somewhere other than where they
         thought, and the words a page ranks for are the words in this tag. -->
    <title>PawSome — Find Playdates for Your Dog or Cat</title>
    <meta
      name="description"
      content="Match your dog or cat with compatible pets nearby, chat with their owner, and plan a real playdate. Join local pet meetups on PawSome."
    />
    <link rel="canonical" href="https://pawsome.bond/" />

    <!-- ── Link previews ───────────────────────────────────────────────────────
         There were none of these at all, so every share of this site — LinkedIn,
         WhatsApp, Slack, iMessage — rendered as a bare blue URL with no image,
         no title and no summary.

         These are static, which for og:url and the title means they describe the
         home page no matter which route was shared. That is not a shortcut: the
         crawlers that build these cards do not run JavaScript, so a value this
         app set at runtime is a value they would never see. Per-route titles are
         handled in useSeo for the crawlers that *do* execute (Google's), and the
         two mechanisms are deliberately separate because their audiences are. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PawSome" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pawsome.bond/" />
    <meta property="og:title" content="PawSome — Find Playdates for Your Dog or Cat" />
    <meta
      property="og:description"
      content="Match your dog or cat with compatible pets nearby, chat with their owner, and plan a real playdate. Join local pet meetups on PawSome."
    />
    <!-- Absolute: a relative path resolves against the crawler, not the site.
         1535x803 — 1.91:1, which is the ratio every one of these services draws
         a card at, so anything else gets cropped somewhere other than where you
         would have chosen. The first version of this was 1200x630 and read
         visibly soft: 1200 is the floor those services accept, not a target,
         and the card is then drawn on 2x displays and re-encoded by whoever
         renders it, which leaves nothing for either. 1535 is the full width of
         the source, so it is more pixels without a single one of upscaling. -->
    <meta property="og:image" content="https://pub-2241f255146e4b8ab3347e935732ec62.r2.dev/site/og-card-v2.jpg" />
    <meta property="og:image:width" content="1535" />
    <meta property="og:image:height" content="803" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Two dogs looking up at the camera on a paved path" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PawSome — Find Playdates for Your Dog or Cat" />
    <meta
      name="twitter:description"
      content="Match your dog or cat with compatible pets nearby, chat with their owner, and plan a real playdate."
    />
    <meta name="twitter:image" content="https://pub-2241f255146e4b8ab3347e935732ec62.r2.dev/site/og-card-v2.jpg" />
    <meta name="twitter:image:alt" content="Two dogs looking up at the camera on a paved path" />

    <!-- Claims only what is demonstrably true on the site. Deliberately no
         aggregateRating or review markup: there is nothing here for it to
         describe, and inventing it is what earns a manual action. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://pawsome.bond/#website",
            "url": "https://pawsome.bond/",
            "name": "PawSome",
            "description": "Match your dog or cat with compatible pets nearby, chat with their owner, and plan a real playdate.",
            "inLanguage": "en",
            "publisher": { "@id": "https://pawsome.bond/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://pawsome.bond/#organization",
            "name": "PawSome",
            "url": "https://pawsome.bond/",
            "logo": "https://pawsome.bond/logo-256.png"
          },
          {
            "@type": "WebApplication",
            "name": "PawSome",
            "url": "https://pawsome.bond/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript.",
            "description": "Match your dog or cat with compatible pets nearby, chat with their owner, and plan a real playdate.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      Loaded non-render-blocking (media=print flips to all on load). A blocking
      stylesheet here meant nothing at all painted until Google Fonts answered,
      which is dead time on every single reload. The splash below falls back to a
      system script face, so it paints without waiting on this.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    </noscript>
    <!-- Fetch the mark alongside the HTML so it's decoded before the splash is
         allowed to become visible 450ms in. -->
    <link rel="preload" as="image" href="/logo-256.png" />
    <script>
      // Disable the browser's built-in scroll restoration so Lenis can own it.
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    <style>
      /* Page background is painted on <html> so there's never a white flash
         between first paint and React mounting. */
      html { background: #0a0a0a; }

      /* Keep the page content hidden until Lenis has restored scroll position.
         useSmoothScroll adds .ready once the position (and session) settle. */
      #root {
        visibility: hidden;
        opacity: 0;
      }
      #root.ready {
        visibility: visible;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      /* ── Pre-React splash ──────────────────────────────────────────────────
         Shows the real PawSome mark (the 256px derivative, 47 KB — not the
         828 KB original, which once made the "loading" screen the slowest thing
         on the page). An earlier pass swapped it for a hand-drawn inline SVG to
         avoid the request entirely; that saved a few milliseconds and cost the
         brand, which is a bad trade for the first thing anyone sees.

         It stays INVISIBLE for the first 450ms, so a reload that resolves
         quickly shows nothing but the app background, and the splash only fades
         in when there is genuinely something to wait for.

         Motion is limited to the one indeterminate rail. Everything here used to
         breathe, pulse, step and shimmer at once, which reads as fidgeting
         rather than loading. */
      #pre-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #0a0a0a;
        opacity: 0;
        /* 450ms hold, then a 350ms fade-in. Fast loads never reach the fade. */
        animation: preloader-in 350ms ease 450ms forwards;
      }

      /* Static brand-warm glow so the mark isn't floating in flat black. It used
         to pulse, which drew the eye to the background instead of the logo. */
      #pre-loader::before {
        content: '';
        position: absolute;
        width: min(560px, 80vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 107, 53, 0.1), transparent 68%);
      }

      .preloader-stack {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      /* ── Logo ── */
      .preloader-mark {
        width: 88px;
        height: 88px;
        display: block;
        filter: drop-shadow(0 8px 26px rgba(255, 107, 53, 0.28));
      }

      /* ── Wordmark ──
         One solid brand colour. The gradient-clipped shimmer it replaces was the
         loudest thing on an otherwise still screen, and gradient-filled text is
         thin and hard to read at any size. */
      .preloader-wordmark {
        font-family: 'Pacifico', 'Segoe Script', 'Brush Script MT', cursive;
        font-size: 1.75rem;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #ff6b35;
      }

      /* ── Indeterminate rail ──
         A short centred rail reads as "working" without the stray edge-of-screen
         sliver the old full-width bottom bar left behind. */
      .preloader-rail {
        position: relative;
        width: 108px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      .preloader-rail::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.85), transparent);
        /* Slower and gentler than before: this is the only motion on the screen,
           so it should read as a pulse of activity, not a strobe. */
        animation: rail-sweep 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Screen-reader-only status text. */
      .preloader-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* Dismissal — crossfades with #root rather than snapping away. */
      #pre-loader.is-done {
        animation: none;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      @keyframes preloader-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes rail-sweep {
        0%   { transform: translateX(-115%); }
        100% { transform: translateX(355%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .preloader-rail::after {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash — the real mark, held invisible for the first 450ms -->
    <div id="pre-loader" role="status" aria-live="polite">
      <div class="preloader-stack">
        <img class="preloader-mark" src="/logo-256.png" alt="" width="88" height="88" decoding="sync" />

        <span class="preloader-wordmark">PawSome</span>

        <div class="preloader-rail" aria-hidden="true"></div>
      </div>
      <span class="preloader-sr">Loading PawSome…</span>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
