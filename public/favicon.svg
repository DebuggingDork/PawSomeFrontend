<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>PawSome</title>
  <!--
    Hand-drawn, not traced. The file this replaces was a 2,659-line auto-trace of
    logo-256.png, and its first path was a full-canvas black rectangle - that
    rectangle is what put a black tile behind the mark in the browser tab.

    Proportions are measured off logo-256.png rather than eyeballed: the pad's
    silhouette, the heart's lobes and point, and where the two muzzles meet were
    all read out of the source pixels, so this sits on the same skeleton as the
    original artwork.

    What is deliberately different is weight. A favicon is looked at at 16px, and
    at that size the trace lost the eyes (hairline strokes) and the ears (same
    fill as the head, so they melted into it). Here the eyes are 2px round-capped
    strokes and each ear carries its own darker tone, which is enough for both to
    survive the downscale.
  -->
  <defs>
    <linearGradient id="pw-coral" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#FF9C8E"/>
      <stop offset="1" stop-color="#F8534F"/>
    </linearGradient>
    <linearGradient id="pw-amber" x1="0.85" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#FFD173"/>
      <stop offset="1" stop-color="#F9971F"/>
    </linearGradient>
  </defs>

  <!-- Toes. Splayed out of the pad, mirrored either side of centre. -->
  <g>
    <ellipse cx="21.5" cy="12.5" rx="4.6" ry="6.5" fill="url(#pw-coral)" transform="rotate(-6 21.5 12.5)"/>
    <ellipse cx="10.8" cy="15.5" rx="4.8" ry="6.5" fill="url(#pw-coral)" transform="rotate(-25 10.8 15.5)"/>
    <ellipse cx="4.75" cy="25"   rx="4.25" ry="5.25" fill="url(#pw-coral)" transform="rotate(-42 4.75 25)"/>
    <ellipse cx="42.5" cy="12.5" rx="4.6" ry="6.5" fill="url(#pw-amber)" transform="rotate(6 42.5 12.5)"/>
    <ellipse cx="53.2" cy="15.5" rx="4.8" ry="6.5" fill="url(#pw-amber)" transform="rotate(25 53.2 15.5)"/>
    <ellipse cx="59.25" cy="25"  rx="4.25" ry="5.25" fill="url(#pw-amber)" transform="rotate(42 59.25 25)"/>
  </g>

  <!-- The little heart between the two inner toes. Drawn a shade larger than the
       source: at 16px the original is under one and a half pixels tall. -->
  <path fill="#F2453D" d="M32 23.2c-1.7-1.9-3.3-3.2-3.3-4.9 0-1.4 1.1-2.2 2.1-2.2.6 0 1 .3 1.2.7.2-.4.6-.7 1.2-.7 1 0 2.1.8 2.1 2.2 0 1.7-1.6 3-3.3 4.9z"/>

  <!-- The pad: two dogs nose to nose, their facing profiles leaving the heart as
       negative space. Left and right are separate paths that overlap by 0.2 at
       the centre seam, so no hairline gap opens up when this is downscaled. -->
  <path fill="url(#pw-coral)" d="M25.5 21.6C22 20.6 18.4 20.9 16.4 22.4c-3.2 2.4-5.8 6-7 10.2-.8 3-.7 7 .5 10.3 1.1 3.1 3.5 6.5 6.7 9.3 3.6 3.1 9 5.4 15.3 5.7v-8.7c-2.3-2.9-5.5-5.8-7.7-9-1.9-2.8-2.8-5.6-1.4-7.3 1.6-1.9 5.4-2.3 7.9-3.1.5-.5.9-1.1 1.2-1.7-1.5-1.6-3.5-4.2-4.7-5.4-.5-.5-1.1-.9-1.7-1.2z"/>
  <path fill="url(#pw-amber)" d="M38.5 21.6c3.5-1 7.1-.7 9.1.8 3.2 2.4 5.8 6 7 10.2.8 3 .7 7-.5 10.3-1.1 3.1-3.5 6.5-6.7 9.3-3.6 3.1-9 5.4-15.3 5.7v-8.7c2.3-2.9 5.5-5.8 7.7-9 1.9-2.8 2.8-5.6 1.4-7.3-1.6-1.9-5.4-2.3-7.9-3.1-.5-.5-.9-1.1-1.2-1.7 1.5-1.6 3.5-4.2 4.7-5.4.5-.5 1.1-.9 1.7-1.2z"/>

  <!-- Ears. The source gives them the same fill as the head and separates them
       with a shadow a few pixels wide, which is exactly why they disappear until
       you zoom in; a distinct tone is what makes them read at tab size. -->
  <path fill="#DC4B45" d="M19.8 24.2c-4-.4-8.2 2-10 5.8-1.2 2.6 0 5.4 2.8 6.2 3 .8 6-1.2 7.2-4.2 1-2.6 1.1-5.6 0-7.8z"/>
  <path fill="#DC8410" d="M44.2 24.2c4-.4 8.2 2 10 5.8 1.2 2.6 0 5.4-2.8 6.2-3 .8-6-1.2-7.2-4.2-1-2.6-1.1-5.6 0-7.8z"/>

  <!-- Closed, happy eyes: 2px round-capped arcs. Thick enough to hold at 16px,
       still an arc rather than a blob when the mark is shown large. -->
  <g fill="none" stroke="#5B2A24" stroke-width="2" stroke-linecap="round">
    <path d="M24.7 26.6c.8-1.5 2.3-1.5 3.1 0"/>
    <path d="M36.2 26.6c.8-1.5 2.3-1.5 3.1 0"/>
  </g>

  <!-- Noses, touching where the two muzzles meet. Set a little below the eyes
       and kept small: on one line and any larger, the four marks fuse into a
       single dark bar across the face once this is scaled to 32px. -->
  <g fill="#5B2A24">
    <ellipse cx="30.9" cy="27.9" rx="1.05" ry="0.95"/>
    <ellipse cx="33.1" cy="27.9" rx="1.05" ry="0.95"/>
  </g>
</svg>
